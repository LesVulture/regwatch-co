packages:
  - collectors
  - web
  - mcp
  - tui
# `db/` NO va aquí: no tiene package.json y pnpm lo ignoraba en silencio, así
# que declararlo era una promesa vacía. Sus scripts se corren desde la raíz
# (`pnpm db:load`) y sus tests los recoge el vitest de la raíz.

# Gestión explícita de scripts de instalación (defensa de cadena de suministro).
# pnpm los bloquea por defecto; cada entrada de este mapa es una decisión consciente.
# `allowBuilds` es la forma preferida desde pnpm 10.26 y reemplaza a
# onlyBuiltDependencies/ignoredBuiltDependencies. Desde v11 esta configuración vive
# en este fichero y ya NO se lee del campo "pnpm" de package.json.
allowBuilds:
  # Vitest lo necesita para compilar su bundler. Es una dependencia de desarrollo
  # con script legítimo, no una sorpresa en tiempo de instalación.
  esbuild: true

  # Serwist (el service worker de la PWA) arrastra @swc/core, que compila un
  # binario nativo al instalar. Misma clase de caso que esbuild: un compilador
  # conocido, no un script sorpresa. Se aprueba EXPLÍCITAMENTE porque
  # `strictDepBuilds` paró la instalación hasta que alguien lo decidiera — que es
  # justo lo que se le pide a esta configuración, y por eso queda escrito aquí
  # en vez de resuelto con `pnpm approve-builds` sin dejar rastro.
  '@swc/core': true

# Falla la instalación si aparece un script de build no decidido, en vez de
# ignorarlo en silencio. Una dependencia nueva con script es una decisión, no
# un detalle: que rompa el CI es lo que se busca.
strictDepBuilds: true
