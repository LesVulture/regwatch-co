name: verify
on: [push, pull_request]
jobs:
  provenance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      # Sin `npm install`: el proyecto no tiene dependencias a propósito.
      - run: node tests/test-provenance.mjs
      - run: node bin/verify.mjs
